name: PHP Checks

concurrency:
  group: php-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Pull requests validate topic branches; push runs are reserved for main to avoid
  # duplicate CI runs for every commit on a branch that already has an open PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-root
          MARIADB_DATABASE: teamcode_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo_mysql
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app public tests bin database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run smoke tests
        run: php tests/run.php

      - name: Check design-system assets
        run: php tests/design-system.php

      - name: Check workspace UI contracts
        run: php tests/workspace-ui.php

      - name: Check deployment workflow safety
        run: php tests/deployment-workflow.php

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/ui.js
          node --check public/assets/js/workspace.js

      - name: Run MariaDB integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: teamcode_hub_test
          DB_USERNAME: root
          DB_PASSWORD: test-root
        run: php tests/integration.php
